<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="ti-title ti-description">
  <title id="ti-title">Robert Porchas — Software Engineer</title>
  <desc id="ti-description">A terminal introducing Robert Porchas, a computer science student and software engineer interested in full-stack development, backend engineering, and cloud infrastructure. Currently building and deploying full-stack applications, creating maintainable backend services, and improving software engineering skills. Technologies: Java, Spring Boot, TypeScript, JavaScript, React, Next.js, PostgreSQL, AWS, Git, and GitHub.</desc>
  <!--
    Adapted from the Typewriter Intro terminal template:
    https://github.com/beydemirfurkan/awesome-github-profile/blob/main/assets/animated/typewriter-intro.svg

    MIT License

    Copyright (c) 2026 Awesome GitHub Profile contributors

    Permission is hereby granted, free of charge, to any person obtaining a copy

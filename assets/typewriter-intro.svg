    in the Software without restriction, including without limitation the rights
    to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
    copies of the Software, and to permit persons to whom the Software is
    furnished to do so, subject to the following conditions:

    The above copyright notice and this permission notice shall be included in all
    copies or substantial portions of the Software.

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
    IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
    FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
    AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
    LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
    OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
    SOFTWARE.
  -->
  <defs>
    <linearGradient id="ti-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="ti-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        #ti-cursor { visibility: hidden; }
        #ti-cursor-static { visibility: visible; }
      }
    </style>
  </defs>

  <rect width="1000" height="600" fill="url(#ti-stage)"/>

  <!-- Original terminal chrome, resized to keep the larger text readable. -->
  <g filter="url(#ti-shadow)">
    <rect x="32" y="24" width="936" height="536" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="32" y="24" width="936" height="44" rx="14" fill="#161b22"/>
    <rect x="32" y="46" width="936" height="22" fill="#161b22"/>
    <line x1="32" y1="68" x2="968" y2="68" stroke="#30363d"/>
  </g>

  <circle cx="58" cy="46" r="6.5" fill="#ff5f56"/>
  <circle cx="80" cy="46" r="6.5" fill="#ffbd2e"/>
  <circle cx="102" cy="46" r="6.5" fill="#27c93f"/>

  <text x="500" y="51" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" fill="#919baa" letter-spacing="1">~/Robert-Porchas — zsh</text>

  <g font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="18" fill="#c9d1d9">
    <!-- Prompt 1: identity. Inline spans keep commands aligned with the prompt. -->
    <text x="68" y="108"><tspan fill="#a78bfa">Robert-Porchas</tspan><tspan fill="#919baa">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#7ee787">$ whoami</tspan></text>
    <text x="68" y="140" font-size="20"><tspan fill="#58a6ff">Robert Porchas</tspan><tspan fill="#919baa"> — </tspan><tspan>Software Engineer</tspan></text>
    <text x="68" y="166">Computer science student exploring full-stack development,</text>
    <text x="68" y="192">backend engineering, and cloud infrastructure.</text>

    <!-- Prompt 2: current work, using only user-provided details. -->
    <text x="68" y="236"><tspan fill="#a78bfa">Robert-Porchas</tspan><tspan fill="#919baa">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#7ee787">$ cat </tspan><tspan fill="#58a6ff">currently-working-on.md</tspan></text>
    <text x="68" y="268"><tspan fill="#7ee787">- </tspan><tspan>Building and deploying full-stack applications.</tspan></text>
    <text x="68" y="294"><tspan fill="#7ee787">- </tspan><tspan>Creating maintainable backend services.</tspan></text>
    <text x="68" y="320"><tspan fill="#7ee787">- </tspan><tspan>Sharpening my software engineering skills.</tspan></text>

    <!-- Prompt 3: aligned stack categories, without badges or external assets. -->
    <text x="68" y="364"><tspan fill="#a78bfa">Robert-Porchas</tspan><tspan fill="#919baa">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#7ee787">$ cat </tspan><tspan fill="#58a6ff">tech-stack.txt</tspan></text>
    <text x="68" y="396" fill="#a78bfa">languages</text>
    <text x="208" y="396">Java · TypeScript · JavaScript</text>
    <text x="68" y="422" fill="#a78bfa">frameworks</text>
    <text x="208" y="422">Spring Boot · React · Next.js</text>
    <text x="68" y="448" fill="#a78bfa">data/tools</text>
    <text x="208" y="448">PostgreSQL · AWS · Git · GitHub</text>

    <!-- Idle prompt: retain the template's only animation, a quiet cursor blink. -->
    <text x="68" y="500"><tspan fill="#a78bfa">Robert-Porchas</tspan><tspan fill="#919baa">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#7ee787">$</tspan></text>
    <rect id="ti-cursor-static" x="264" y="484" width="10" height="20" fill="#c9d1d9" visibility="hidden"/>
    <rect id="ti-cursor" x="264" y="484" width="10" height="20" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Status strip, kept inside the rounded window. -->
  <rect x="32" y="534" width="936" height="26" rx="14" fill="#161b22"/>
  <rect x="32" y="534" width="936" height="13" fill="#161b22"/>
  <line x1="32" y1="534" x2="968" y2="534" stroke="#30363d"/>
  <g transform="translate(32,552)" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#919baa">
    <text x="36" y="0">UTF-8</text>
    <text x="116" y="0">zsh</text>
    <text x="176" y="0">ctrl-l · clear</text>
    <text x="900" y="0" text-anchor="end" fill="#7ee787">● ready</text>
  </g>
</svg>
